<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Сайт больше не доступен</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: #141414;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrapper svg {
            width: 36px;
            height: 36px;
            stroke: #666;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.6;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #141414;
            border: 1px solid #2a2a2a;
            padding: 8px 22px;
            border-radius: 100px;
            font-size: 13px;
            color: #666;
            margin-bottom: 28px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff4d4d;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                background: #ff4d4d;
                opacity: 0.4;
            }
            50% {
                background: #ff4d4d;
                opacity: 1;
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            background: none;
            border: none;
            font-family: inherit;
        }

        .back-link:hover {
            color: #fff;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            stroke: #666;
            fill: none;
            stroke-width: 1.8;
            transition: 0.3s;
        }

        .back-link:hover svg {
            stroke: #fff;
            transform: translateX(-2px);
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #2a2a2a;
            margin: 24px auto;
        }

        .footer-text {
            font-size: 11px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="13"/>
                <circle cx="12" cy="16.5" r="1.2" fill="#666" stroke="none"/>
                <line x1="4" y1="4" x2="20" y2="20"/>
            </svg>
        </div>

        <h1>Ой, сайт больше не доступен :(</h1>

        <p class="subtitle">
            К сожалению, мы не можем продолжить работу из-за нарушения авторских прав.<br>
            Спасибо, что были с нами.
        </p>

        <div class="status-badge">
            <span class="status-dot"></span>
            Сервис закрыт
        </div>

        <div class="divider"></div>

        <a class="back-link" onclick="history.back()">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Вернуться назад
        </a>

        <p class="footer-text" style="margin-top: 20px;"></p>
    </div>
</body>
</html>
