<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniWatch.ru — Смотри аниме онлайн</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <!-- ШАПКА -->
    <header>
        <div class="logo">
            <i class="fas fa-play-circle"></i> Ani<span>Watch</span>.ru
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск аниме..." />
            <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- ОСНОВНАЯ ЧАСТЬ -->
    <main class="container">
        <!-- Последние релизы -->
        <section>
            <div class="section-title">
                <i class="fas fa-fire"></i> Последние релизы
            </div>
            <div id="latestGrid" class="anime-grid"></div>
        </section>

        <!-- Случайные релизы -->
        <section>
            <div class="section-title">
                <i class="fas fa-random"></i> Случайные тайтлы
            </div>
            <div id="randomGrid" class="anime-grid"></div>
        </section>

        <!-- Все релизы -->
        <section>
            <div class="section-title">
                <i class="fas fa-list-ul"></i> Все релизы
            </div>
            <div id="allGrid" class="anime-grid"></div>
        </section>

        <!-- Лоадер -->
        <div id="loader" class="loader">
            <i class="fas fa-spinner fa-pulse"></i>
            Загрузка аниме...
        </div>

        <!-- ПЛЕЕР -->
        <section id="playerSection" class="player-section">
            <h2 id="playerTitle">Название аниме</h2>
            <div id="episodeButtons" class="episode-list"></div>
            <div class="video-container">
                <iframe id="videoFrame" src="" allowfullscreen></iframe>
            </div>
            <p class="player-source">Источник: AniLiberty API v1</p>
        </section>
    </main>

    <!-- ПОДВАЛ -->
    <footer>
        <p>AniWatch.ru — неофициальный клиент AniLiberty API. Все права принадлежат правообладателям.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
